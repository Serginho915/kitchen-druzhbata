services:
  backend:
    container_name: kitchen-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
    ports:
      - "8004:8000"
    environment:
      DEBUG: "0"
      SECRET_KEY: prod-secret-key-change-me
      ALLOWED_HOSTS: sofiafood.bg,www.sofiafood.bg,localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: https://sofiafood.bg,https://www.sofiafood.bg
      CSRF_TRUSTED_ORIGINS: https://sofiafood.bg,https://www.sofiafood.bg
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://sofiafood.bg}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-SofiaFood}
    restart: unless-stopped

  frontend:
    container_name: kitchen-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    depends_on:
      - backend
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped

  recipe-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    command: python manage.py recipe_worker --poll-interval 300
    depends_on:
      - backend
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
    environment:
      DEBUG: "0"
      SECRET_KEY: prod-secret-key-change-me
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://sofiafood.bg}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-SofiaFood}
    restart: unless-stopped
